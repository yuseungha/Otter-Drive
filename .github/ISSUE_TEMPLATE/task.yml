name: 작업 요청
description: 맡을 조각, 제출물, 필요한 자원을 간단히 등록합니다.
title: "[TASK] "
body:
  - type: markdown
    attributes:
      value: |
        상위 Issue 하나를 한 명이 전부 맡지 않습니다. 같은 분야에서도 OpenCV, YOLO, LiDAR, 학습, 퓨전처럼 본인이 만들 조각을 골라주세요. 작업 시작 시 Project 상태를 **In Progress**로 바꾸고 개인 브랜치와 Pull Request로 결과를 제출합니다.

  - type: dropdown
    id: work_area
    attributes:
      label: 작업 분야
      options:
        - 차선·YOLO·경로
        - 장애물·신호등·LiDAR
        - Jetson·차량
        - CAD·프린팅
        - YOLO 학습·PT 검증
    validations:
      required: true

  - type: textarea
    id: work_slot
    attributes:
      label: 내가 맡을 조각·접근 방식
      description: 분야 전체가 아니라 본인이 직접 만들 결과 한 가지를 적습니다.
      placeholder: 예) 공개 라바콘 데이터셋으로 YOLO 후보 PT를 학습하고 기존 YOLO 노드에서 교체 실행한다.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 이번 작업 목표
      description: 이번 PR에서 실제로 가능하게 만들 결과를 적습니다.
      placeholder: 예) model_path 설정만 바꿔 후보 PT를 실행하고 주행 영상 결과를 비교한다.
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: 제출할 결과
      description: 코드, 노드, 학습 설정, README, 실행 결과 중 무엇을 올릴지 적습니다.
      placeholder: |
        - 코드·폴더 또는 학습 스크립트:
        - 실행·학습 명령:
        - 결과 영상·로그·지표:
        - 데이터·PT·rosbag·CAD 링크:
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 현재 상태와 다음 행동
      placeholder: |
        - 현재까지 된 것:
        - 다음에 할 것:
        - 완료 예상일:
    validations:
      required: true

  - type: dropdown
    id: resource
    attributes:
      label: 지금 필요한 자원
      options:
        - 개인 노트북만 사용
        - GPU·Colab 등 학습 환경
        - LiDAR
        - Jetson
        - 차량
        - 외부 3D 출력소
        - 경희대 시험 공간
        - 국민대 트랙
    validations:
      required: true

  - type: textarea
    id: blocker
    attributes:
      label: 막힌 문제 또는 필요한 도움
      description: 없으면 "없음"이라고 적습니다. 장비가 없어도 가능한 녹화·rosbag·Mock 작업을 먼저 적어주세요.
      placeholder: 없음
    validations:
      required: true

  - type: checkboxes
    id: rules
    attributes:
      label: 제출 확인
      options:
        - label: 분야 전체가 아니라 내가 맡을 조각과 결과를 명확히 적었습니다.
          required: true
        - label: main에 직접 push하지 않고 개인 브랜치와 Pull Request를 사용합니다.
          required: true
        - label: 데이터셋, rosbag, PT, CAD 대용량 파일은 Drive 링크만 남깁니다.
          required: true
