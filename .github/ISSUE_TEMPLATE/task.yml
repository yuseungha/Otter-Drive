name: 작업 요청
description: 담당 작업, 제출물, 막힌 문제를 간단히 등록합니다.
title: "[TASK] "
body:
  - type: markdown
    attributes:
      value: |
        아래 항목만 작성하면 됩니다. 작업을 시작하면 Project 상태를 **In Progress**로 바꾸고, 결과는 개인 브랜치와 Pull Request로 제출하세요.

  - type: dropdown
    id: work_area
    attributes:
      label: 작업 분야
      options:
        - 차선·YOLO·경로
        - 장애물·신호등·LiDAR
        - Jetson·차량
        - CAD·프린팅
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 이번 작업 목표
      description: 이번에 실제로 가능하게 만들 한 가지 결과를 적습니다.
      placeholder: 예) 녹화 영상 입력부터 차선 중심 경로 출력까지 한 번에 실행되게 한다.
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: 제출할 결과
      description: 코드, README, 실행 결과, 데이터 링크 중 무엇을 올릴지 적습니다.
      placeholder: |
        - 코드/폴더:
        - 실행 명령:
        - 결과 영상 또는 로그:
        - 데이터·모델·rosbag 링크:
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 현재 상태와 다음 행동
      placeholder: |
        - 현재까지 된 것:
        - 다음에 할 것:
        - 완료 예상일:
    validations:
      required: true

  - type: dropdown
    id: resource
    attributes:
      label: 지금 필요한 자원
      options:
        - 개인 노트북만 사용
        - LiDAR
        - Jetson
        - 차량
        - 외부 3D 출력소
        - 경희대 시험 공간
        - 국민대 트랙
    validations:
      required: true

  - type: textarea
    id: blocker
    attributes:
      label: 막힌 문제 또는 필요한 도움
      description: 없으면 "없음"이라고 적습니다. 장비가 없어도 가능한 Mock·녹화 입력 작업을 먼저 적어주세요.
      placeholder: 없음
    validations:
      required: true

  - type: checkboxes
    id: rules
    attributes:
      label: 제출 확인
      options:
        - label: main에 직접 push하지 않고 개인 브랜치와 Pull Request를 사용합니다.
          required: true
        - label: 데이터셋, rosbag, .pt 같은 큰 파일은 Drive 링크만 남깁니다.
          required: true
