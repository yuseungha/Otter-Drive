<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jetson RC Car 수동주행</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071018;
      --panel: #0e1b26;
      --line: #263b4b;
      --text: #e8f1f7;
      --muted: #8fa6b6;
      --cyan: #31d6c4;
      --yellow: #ffc857;
      --red: #ff5263;
      --green: #52db8a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #123044 0, var(--bg) 48%);
      color: var(--text);
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif;
    }
    main { width: min(980px, calc(100% - 28px)); margin: 24px auto 48px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(24px, 5vw, 38px); letter-spacing: -.04em; }
    .subtitle { margin: 6px 0 0; color: var(--muted); }
    .badge { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: #0a151e; font-size: 13px; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; }
    .panel { background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: 0 18px 50px #0005; }
    .panel h2 { margin: 0 0 14px; font-size: 17px; }
    .status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .metric { background: #09141d; border: 1px solid #1b303f; border-radius: 12px; padding: 12px; }
    .metric span { display: block; color: var(--muted); font-size: 12px; }
    .metric strong { display: block; margin-top: 6px; font-size: 18px; }
    .good { color: var(--green); }
    .warn { color: var(--yellow); }
    .bad { color: var(--red); }
    .check { display: flex; gap: 10px; align-items: flex-start; background: #111c24; border: 1px solid var(--line); padding: 12px; border-radius: 12px; margin: 14px 0; line-height: 1.5; }
    .check input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--cyan); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { border: 0; border-radius: 12px; min-height: 50px; font: inherit; font-weight: 800; cursor: pointer; touch-action: none; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    #arm { background: var(--cyan); color: #03110f; }
    #estop { background: var(--red); color: white; }
    .pad { display: grid; grid-template-columns: repeat(3, 78px); justify-content: center; gap: 10px; margin: 18px 0; }
    .pad button { height: 70px; background: #182a37; color: var(--text); border: 1px solid #345064; font-size: 23px; }
    .pad button.active { background: var(--cyan); color: #03110f; transform: translateY(2px); }
    .pad .stop { background: #44202a; border-color: #7d2c3b; color: #ffdbe0; }
    .slider { display: grid; grid-template-columns: 100px 1fr 56px; gap: 10px; align-items: center; margin: 13px 0; }
    input[type="range"] { width: 100%; accent-color: var(--cyan); }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.65; }
    .log { margin-top: 12px; padding: 10px 12px; min-height: 42px; background: #071018; border: 1px solid #1a2c39; border-radius: 10px; color: var(--muted); font: 12px ui-monospace, monospace; }
    kbd { border: 1px solid #4a6070; border-bottom-width: 3px; padding: 2px 6px; border-radius: 5px; background: #182733; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } header { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Jetson RC Car 수동주행</h1>
        <p class="subtitle">키를 누르고 있는 동안만 움직이는 데드맨 방식</p>
      </div>
      <div id="networkBadge" class="badge warn">연결 확인 중</div>
    </header>

    <div class="grid">
      <section class="panel">
        <h2>운행 상태</h2>
        <div class="status-grid">
          <div class="metric"><span>실행 모드</span><strong id="mode">확인 중</strong></div>
          <div class="metric"><span>Arduino 시리얼</span><strong id="serial">확인 중</strong></div>
          <div class="metric"><span>운행 허가</span><strong id="armed">해제</strong></div>
          <div class="metric"><span>마지막 정지 원인</span><strong id="reason">startup</strong></div>
          <div class="metric"><span>Throttle</span><strong id="throttle">0</strong></div>
          <div class="metric"><span>Steering</span><strong id="steering">0</strong></div>
        </div>

        <label class="check">
          <input id="safetyCheck" type="checkbox">
          <span>바퀴를 지면에서 띄웠고, 주변을 비웠으며, 물리 비상정지 수단을 준비했습니다.</span>
        </label>
        <div class="actions">
          <button id="arm" disabled>운행 허가(ARM)</button>
          <button id="estop">비상정지</button>
        </div>
        <div id="log" class="log">서버 응답을 기다리는 중...</div>
      </section>

      <section class="panel">
        <h2>조작</h2>
        <div class="pad">
          <span></span><button data-key="forward">▲<br><small>W</small></button><span></span>
          <button data-key="left">◀<br><small>A</small></button>
          <button class="stop" data-key="stop">■</button>
          <button data-key="right">▶<br><small>D</small></button>
          <span></span><button data-key="reverse">▼<br><small>S</small></button><span></span>
        </div>

        <div class="slider">
          <label for="forwardLimit">전진 제한</label>
          <input id="forwardLimit" type="range" min="50" max="400" step="10" value="150">
          <output id="forwardValue">15%</output>
        </div>
        <div class="slider">
          <label for="reverseLimit">후진 제한</label>
          <input id="reverseLimit" type="range" min="50" max="300" step="10" value="100">
          <output id="reverseValue">10%</output>
        </div>
        <div class="slider">
          <label for="steerLimit">조향 제한</label>
          <input id="steerLimit" type="range" min="100" max="1000" step="50" value="350">
          <output id="steerValue">35%</output>
        </div>

        <p class="hint">
          <kbd>W</kbd>/<kbd>S</kbd> 전진·후진,
          <kbd>A</kbd>/<kbd>D</kbd> 좌·우 조향,
          <kbd>Space</kbd> 또는 <kbd>Esc</kbd> 비상정지.<br>
          창을 벗어나거나 약 0.25초 동안 명령이 끊기면 자동으로 정지하고 ARM이 해제됩니다.
        </p>
      </section>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const held = new Set();
    let armed = false;
    let requestInFlight = false;
    let online = false;

    const keyMap = {
      KeyW: 'forward', ArrowUp: 'forward',
      KeyS: 'reverse', ArrowDown: 'reverse',
      KeyA: 'left', ArrowLeft: 'left',
      KeyD: 'right', ArrowRight: 'right'
    };

    async function post(path, payload = {}) {
      const response = await fetch(path, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
        cache: 'no-store',
        keepalive: true
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.reason || `HTTP ${response.status}`);
      return data;
    }

    function values() {
      let throttle = 0;
      let steering = 0;
      if (held.has('forward') !== held.has('reverse')) {
        throttle = held.has('forward') ? +$('forwardLimit').value : -$('reverseLimit').value;
      }
      if (held.has('left') !== held.has('right')) {
        steering = held.has('left') ? +$('steerLimit').value : -$('steerLimit').value;
      }
      return {throttle, steering};
    }

    function setHeld(name, pressed) {
      if (pressed) held.add(name); else held.delete(name);
      document.querySelectorAll('[data-key]').forEach((button) => {
        button.classList.toggle('active', held.has(button.dataset.key));
      });
      sendCommand();
    }

    async function sendCommand() {
      if (!armed || requestInFlight) return;
      requestInFlight = true;
      try {
        await post('/api/command', values());
      } catch (error) {
        armed = false;
        held.clear();
        $('log').textContent = `명령 중단: ${error.message}`;
      } finally {
        requestInFlight = false;
      }
    }

    async function emergencyStop(reason = '사용자 비상정지') {
      held.clear();
      armed = false;
      try { await post('/api/estop'); } catch (_) {}
      $('log').textContent = reason;
      await refreshStatus();
    }

    async function refreshStatus() {
      try {
        const response = await fetch('/api/status', {cache: 'no-store'});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const status = await response.json();
        online = true;
        armed = status.armed;
        $('networkBadge').textContent = 'Jetson 연결됨';
        $('networkBadge').className = 'badge good';
        $('mode').textContent = status.dry_run ? 'DRY-RUN' : 'HARDWARE';
        $('mode').className = status.dry_run ? 'warn' : 'good';
        $('serial').textContent = status.dry_run ? '사용 안 함' : (status.serial_connected ? '연결됨' : '연결 안 됨');
        $('serial').className = status.serial_connected ? 'good' : 'warn';
        $('armed').textContent = armed ? 'ARMED' : '해제';
        $('armed').className = armed ? 'good' : 'bad';
        $('reason').textContent = status.stop_reason || '-';
        $('throttle').textContent = status.throttle;
        $('steering').textContent = status.steering;
        $('arm').textContent = armed ? '운행 허가됨' : '운행 허가(ARM)';
        $('arm').disabled = armed || !$('safetyCheck').checked;
      } catch (error) {
        online = false;
        armed = false;
        held.clear();
        $('networkBadge').textContent = 'Jetson 연결 끊김';
        $('networkBadge').className = 'badge bad';
        $('log').textContent = `연결 오류: ${error.message}`;
      }
    }

    $('safetyCheck').addEventListener('change', () => {
      $('arm').disabled = armed || !$('safetyCheck').checked || !online;
    });
    $('arm').addEventListener('click', async () => {
      if (!$('safetyCheck').checked) return;
      try {
        const result = await post('/api/arm');
        armed = result.ok;
        $('log').textContent = 'ARM 완료. 키를 누르고 있는 동안만 명령이 전송됩니다.';
        sendCommand();
      } catch (error) {
        $('log').textContent = `ARM 실패: ${error.message}`;
      }
      refreshStatus();
    });
    $('estop').addEventListener('click', () => emergencyStop());

    document.addEventListener('keydown', (event) => {
      if (event.code === 'Space' || event.code === 'Escape') {
        event.preventDefault();
        emergencyStop('키보드 비상정지');
        return;
      }
      const mapped = keyMap[event.code];
      if (mapped) {
        event.preventDefault();
        setHeld(mapped, true);
      }
    });
    document.addEventListener('keyup', (event) => {
      const mapped = keyMap[event.code];
      if (mapped) {
        event.preventDefault();
        setHeld(mapped, false);
      }
    });

    document.querySelectorAll('[data-key]').forEach((button) => {
      const name = button.dataset.key;
      if (name === 'stop') {
        button.addEventListener('pointerdown', () => emergencyStop('화면 비상정지'));
        return;
      }
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        setHeld(name, true);
      });
      for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
        button.addEventListener(type, () => setHeld(name, false));
      }
    });

    for (const [slider, output] of [
      ['forwardLimit', 'forwardValue'], ['reverseLimit', 'reverseValue'], ['steerLimit', 'steerValue']
    ]) {
      $(slider).addEventListener('input', () => {
        $(output).textContent = `${Math.round($(slider).value / 10)}%`;
      });
    }

    window.addEventListener('blur', () => { if (armed) emergencyStop('조작창 이탈로 자동 정지'); });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && armed) emergencyStop('화면 전환으로 자동 정지');
    });
    window.addEventListener('beforeunload', () => {
      navigator.sendBeacon('/api/estop', '{}');
    });

    setInterval(sendCommand, 50);
    setInterval(refreshStatus, 250);
    refreshStatus();
  </script>
</body>
</html>
