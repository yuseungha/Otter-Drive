/**:
  ros__parameters:
    path_topic: cone_planner/center_path
    planner_status_topic: cone_planner/status
    command_topic: cone_controller/command
    compat_command_topic: cone_controller/command_vector
    controller_status_topic: cone_controller/status
    odom_topic: odom

    # This profile is simulation-only. The measured-geometry interlock remains
    # false in the real-vehicle profile.
    allow_compat_command: true
    enabled_on_startup: false
    geometry_confirmed: true
    require_odometry: true
    planning_frame: sim_base_link
    odom_child_frame: sim_base_link

    wheelbase_m: 0.20
    max_steering_angle_rad: 0.6108652382
    planner_max_curvature_1pm: 3.5

    control_frequency_hz: 50.0
    path_timeout_s: 0.25
    status_timeout_s: 0.25
    receipt_timeout_s: 0.30
    max_stamp_skew_s: 0.005
    max_future_stamp_s: 0.05
    max_uncompensated_motion_m: 0.025
    minimum_stop_hold_s: 0.50
    max_path_points: 500
    valid_frames_before_motion: 3
    odom_timeout_s: 0.25

    lookahead_min_m: 0.25
    lookahead_max_m: 0.55
    lookahead_time_s: 0.75
    min_target_forward_m: 0.08
    min_remaining_path_m: 0.25
    # At an A1-like 10 Hz scan rate, 0.10 m/s leaves enough path-age margin
    # for the fail-closed uncompensated-motion gate on modest CPUs/WSL.
    max_speed_mps: 0.10
    max_lateral_accel_mps2: 0.15
    max_accel_mps2: 0.20
    max_decel_mps2: 0.50
    stopping_buffer_m: 0.12
    max_steering_rate_rad_s: 1.50
    min_plan_confidence: 0.40
    confidence_speed_floor: 0.35
    virtual_speed_factor: 0.60
    reject_steering_saturation: true
