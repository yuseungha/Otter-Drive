# KMU AutoDriving - camera configuration (operational overrides)
#
# Splits the camera/device settings out of the ROS package so the same source
# tree runs on the laptop and on the Jetson with no code edits.
# Device path comes from KMU_CAMERA_DEVICE in .env; the value below is the
# fallback when the variable is unset.

usb_camera_source:
  ros__parameters:
    # Live capture device on the Jetson. Override with KMU_CAMERA_DEVICE.
    device: /dev/video0
    image_topic: /camera/front/image_raw
    frame_id: front_camera

    # The lane model was trained and validated at 640x480 @ 15 fps.
    # The node default is 1280x720@30, which does NOT match the training
    # distribution and costs inference time on the Jetson.
    width: 640
    height: 480
    fps: 15.0

    reconnect_interval_sec: 1.0

# Laptop-only: replay a recorded MP4 instead of a live camera.
# video_path is intentionally empty. Supply it via KMU_VIDEO_PATH or
# --video on run_competition.sh. Never hardcode a laptop path here.
video_source:
  ros__parameters:
    video_path: ""
    image_topic: /camera/front/image_raw
    frame_id: front_camera
    loop: true
    playback_rate: 1.0
    output_width: 640
    output_height: 480
    wait_for_lane_ready: false
