sensor_mode_manager:
  ros__parameters:
    lane_confirm_window: 5
    lane_confirm_required: 4
    lane_reacquire_timeout_sec: 3.0
    lidar_path_timeout_sec: 10.0
    perception_result_max_age_sec: 0.35
    sensor_timeout_sec: 0.60
    path_timeout_sec: 3.0
    subscription_switch_timeout_sec: 3.0
    # The Jetson cold-start measurement was about 7 s. Keep enough margin for
    # camera enumeration and the first inference heartbeat under load.
    startup_grace_sec: 15.0
    watchdog_rate_hz: 20.0
    # Keep camera-triggered entry disabled until orange-area thresholds are
    # measured on the real course. Use set_cone_mode for controlled tests.
    automatic_cone_transition_enabled: false
    # The one-gate LiDAR run ends only by operator request or a safety fault.
    automatic_cone_exit_enabled: false

mode_command_mux:
  ros__parameters:
    dry_run: true
    command_timeout_sec: 0.25
    output_rate_hz: 20.0
    lane_command_topic: /vehicle/lane_drive_cmd
    cone_command_topic: /vehicle/cone_drive_cmd
    preview_output_topic: /rc_car/drive_cmd_preview
    live_output_topic: /rc_car/drive_cmd
