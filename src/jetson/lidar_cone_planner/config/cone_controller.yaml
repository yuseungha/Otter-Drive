/**:
  ros__parameters:
    path_topic: cone_planner/center_path
    planner_status_topic: cone_planner/status
    command_topic: cone_controller/command
    compat_command_topic: cone_controller/command_vector
    allow_compat_command: false
    controller_status_topic: cone_controller/status
    odom_topic: odom
    planning_frame: base_link

    # The controller runs disabled until explicitly armed. Before changing
    # geometry_confirmed to true, measure wheelbase and actual road-wheel angle.
    enabled_on_startup: false
    active_mission_state: CONE_SLALOM
    enforce_mission_state: false
    geometry_confirmed: false
    wheelbase_m: 0.20
    max_steering_angle_rad: 0.6108652382  # 35 degrees; placeholder only
    planner_max_curvature_1pm: 3.5

    control_frequency_hz: 50.0
    path_timeout_s: 0.80
    status_timeout_s: 0.80
    receipt_timeout_s: 0.80
    max_stamp_skew_s: 0.005
    max_future_stamp_s: 0.05
    max_uncompensated_motion_m: 0.16
    minimum_stop_hold_s: 0.10
    max_path_points: 500
    valid_frames_before_motion: 1

    # Set true when reliable wheel odometry is available. Without it, the
    # controller estimates motion from its own previous command and stays slow.
    require_odometry: true
    odom_timeout_s: 0.25
    odom_child_frame: base_link

    lookahead_min_m: 0.25
    lookahead_max_m: 0.55
    lookahead_time_s: 0.75
    min_target_forward_m: 0.08
    min_remaining_path_m: 0.25

    max_speed_mps: 0.20
    max_lateral_accel_mps2: 0.15
    max_accel_mps2: 0.20
    max_decel_mps2: 0.50
    stopping_buffer_m: 0.12
    max_steering_rate_rad_s: 1.50

    min_plan_confidence: 0.0
    confidence_speed_floor: 0.35
    virtual_speed_factor: 0.60
    reject_steering_saturation: true
