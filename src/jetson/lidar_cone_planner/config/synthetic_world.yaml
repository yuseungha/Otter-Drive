/**:
  ros__parameters:
    # All topics are relative and are isolated by the launch namespace.
    scan_topic: scan
    odom_topic: odom
    command_topic: cone_controller/command_vector
    ground_truth_path_topic: synthetic_world/ground_truth_path
    marker_topic: synthetic_world/markers
    status_topic: synthetic_world/status
    controller_enable_service: cone_controller/set_enabled

    odom_frame: sim_odom
    base_frame: sim_base_link
    laser_frame: sim_laser

    scenario: straight
    course_length_m: 4.5
    # Slightly wider than the 0.60 m mathematical minimum so the simulated
    # 0.50 m vehicle retains measurable clearance to the cone surface.
    track_width_m: 0.64
    cone_spacing_m: 0.297
    # Radius of the section intersected by the simulated LiDAR plane.
    cone_radius_m: 0.015
    first_cone_distance_m: 0.30
    arc_radius_m: 5.0
    s_bend_amplitude_m: 0.35

    physics_frequency_hz: 50.0
    scan_frequency_hz: 10.0
    metrics_frequency_hz: 10.0
    wheelbase_m: 0.20
    vehicle_footprint_radius_m: 0.25

    max_command_speed_mps: 0.10
    max_command_steering_rad: 0.6108652382
    max_command_age_s: 0.25
    max_future_command_s: 0.05
    command_receipt_timeout_s: 0.30
    max_accel_mps2: 0.20
    max_decel_mps2: 0.80
    max_steering_rate_rad_s: 1.50

    # 0.333 degree beams, close to a compensated 1080-bin scan.
    angle_min_rad: -3.141592653589793
    angle_max_rad: 3.141592653589793
    beam_count: 1081
    range_min_m: 0.15
    range_max_m: 5.0
    laser_x_m: 0.0
    laser_y_m: 0.0
    laser_yaw_rad: 0.0
    random_seed: 7
    gaussian_noise_std_m: 0.002
    range_quantization_m: 0.001
    beam_dropout_probability: 0.0
    same_range_replica_probability: 0.0
    same_range_replica_span_beams: 0
    glint_probability: 0.0
    glint_range_min_m: 0.15
    glint_range_max_m: 2.0

    # Negative disables the fault. Launch arguments can override both values.
    drop_scan_after_s: -1.0
    drop_scan_duration_s: 0.0
    auto_enable_controller: true
    auto_enable_delay_s: 1.0
