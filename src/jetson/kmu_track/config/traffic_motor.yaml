traffic_motor_controller:
  ros__parameters:
    # Safe deployment defaults: preview topic only, no hardware output.
    enabled: false
    dry_run: true
    hardware_confirmed: false
    require_serial_ready: true
    # GO and TURN LEFT use the full normalized ESC command (1000).
    # Existing keyboard/firmware contract: positive steering means left.
    left_steering: 350
    gear: -1
    signal_timeout_sec: 0.50
    speed_timeout_sec: 0.50
    stopped_speed_mps: 0.03
    center_fallback_delay_sec: 0.75
    arming_neutral_sec: 1.0
    command_rate_hz: 20.0
    manual_mode: false
    manual_command_topic: /rc_car/manual_drive_cmd
    manual_timeout_sec: 0.50
