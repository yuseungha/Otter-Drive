yolo_seg_lane_detector:
  ros__parameters:
    image_topic: /camera/front/image_raw
    confidence_threshold: 0.25
    iou_threshold: 0.45
    input_size: 640
    device: auto
    half_precision: true
    inference_rate_hz: 10.0
    max_detections: 12
    warmup: true
    managed_subscription: false

    # Verified from models/lane_seg_v3_e37.pt.
    center_class_name: center
    boundary_class_name: lane

    # Image-space planning rows, from far (top) to near (bottom).
    scan_rows: [0.50, 0.58, 0.66, 0.74, 0.82, 0.90, 0.96]
    scan_band_half_height: 5
    mask_threshold: 0.50
    min_lane_width_ratio: 0.10
    min_mask_pixels_per_row: 3
    min_valid_rows: 3
    min_vertical_span_ratio: 0.15
    max_lookahead_extrapolation_ratio: 0.05
    look_ahead_ratio: 0.74
    heading_far_ratio: 0.58
    heading_near_ratio: 0.90
    center_consistency_tol: 0.10
    minimum_plan_confidence: 0.25

    # Four-point image-to-ground calibration for /planning/lane_path.
    # Re-measure after the final camera height and pitch are fixed.
    planning_frame: base_link
    far_left_x_ratio: 0.38
    far_right_x_ratio: 0.62
    far_y_ratio: 0.50
    near_left_x_ratio: 0.10
    near_right_x_ratio: 0.90
    near_y_ratio: 0.98
    near_forward_m: 0.10
    far_forward_m: 2.00
    near_half_width_m: 0.45
    far_half_width_m: 0.45
    minimum_forward_m: 0.02

    publish_lane_overlay: true
    publish_lane_geometry: true
